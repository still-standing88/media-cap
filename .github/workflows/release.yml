name: Publish MediaCap release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-mediacap-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Require the public release repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$GH_REPO" = still-standing88/media-cap
          test "$(gh api "repos/$GH_REPO" --jq .visibility)" = public
      - name: Check for an existing source tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v1.0.0
        run: |
          if tagged_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha 2>/dev/null); then
            test "$tagged_commit" = "$GITHUB_SHA"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check release packaging and README download links
        run: python tests/release/test_packaging.py -v

  windows:
    needs: check
    uses: ./.github/workflows/windows.yml
    with:
      release_build: true

  linux:
    needs: check
    uses: ./.github/workflows/linux.yml
    with:
      release_build: true

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v1.0.0
    steps:
      - name: Download and merge release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Check the asset set
        shell: bash
        run: |
          cd release-assets
          for os in windows linux; do
            case "$os" in
              windows) archive=.zip; exe=.exe ;;
              linux) archive=.tar.gz; exe= ;;
            esac
            for arch in x64 arm64; do
              for variant in release-shared release-static debug-shared; do
                test -s "MediaCap-library-$os-$arch-$variant$archive"
              done
              test -s "MediaCap-cli-$os-$arch$exe"
              test -s "MediaCap-cli-$os-$arch-notices.txt"
              test -s "AudioPix-$os-$arch$archive"
            done
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 24
          # Artifact transfers discard executable permissions on direct binaries.
          chmod +x MediaCap-cli-linux-x64 MediaCap-cli-linux-arm64
      - name: Publish and retain only the latest release
        shell: bash
        run: |
          releases=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | [.tag_name, .draft] | @tsv')
          if ! tagged_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha); then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" --silent
            tagged_commit="$GITHUB_SHA"
          fi
          test "$tagged_commit" = "$GITHUB_SHA"
          if ! grep -Fqx "$RELEASE_TAG"$'\tfalse' <<< "$releases"; then
            if ! grep -Fqx "$RELEASE_TAG"$'\ttrue' <<< "$releases"; then
              gh release create "$RELEASE_TAG" --verify-tag --draft \
                --title "MediaCap ${RELEASE_TAG#v}" \
                --notes "MediaCap libraries (shared and static), standalone static CLI executables, and AudioPix desktop packages for Windows and Linux, on x64 and ARM64. Linux CLI downloads need chmod +x. Extract the full AudioPix archive and run the executable in bin."
            fi
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = "$RELEASE_TAG"
          expected_assets=$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          actual_assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)
          test "$expected_assets" = "$actual_assets"

          while IFS=$'\t' read -r tag draft; do
            if [[ -n "$tag" && "$tag" != "$RELEASE_TAG" && "$draft" == false ]]; then
              gh release delete --yes -- "$tag"
            fi
          done <<< "$releases"
